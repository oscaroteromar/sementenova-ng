{% extends "admin/base_site.html" %}

{% block content %}
  <p>
    Sube un ficheiro ZIP con partituras en PDF. Cada PDF do ZIP crearase como unha
    partitura nova na categoría "Outros", co nome do ficheiro (sen a extensión)
    como título.
  </p>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Importar" class="default" />
  </form>
{% endblock %}
