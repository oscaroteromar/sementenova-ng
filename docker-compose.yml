# Local dev only. Production hosting is not decided yet.
#
# Two ways to run the frontend against this stack:
#  - `npm run dev` on the host, talking to backend on localhost:8000 (CORS)
#  - `docker compose --profile full up`, which also starts `frontend` +
#    `caddy`: a single origin at localhost:2015 fronting both containers
#    (same-origin, no CORS needed on that path). See Caddyfile.dev.
services:
  backend:
    build:
      context: ./backend
    container_name: sementenova-scores-backend
    environment:
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://scores:scores@db:5432/scores
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:2015
    volumes:
      - ./backend:/app
      - /app/.venv # keep the image's Linux-built venv, don't shadow it with the host's
      - scores_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sementenova-frontend
    profiles: ["full"]
    environment:
      VITE_API_URL: "" # same-origin: requests go through the caddy proxy below
      CHOKIDAR_USEPOLLING: "true" # reliable file-watching across the bind mount
    volumes:
      - .:/app
      - /app/node_modules # keep the image's node_modules, don't shadow it with the host's
    depends_on:
      - backend

  caddy:
    image: caddy:2.10
    container_name: sementenova-caddy
    profiles: ["full"]
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
    ports:
      - "2015:2015"
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:16
    container_name: sementenova-scores-db
    environment:
      POSTGRES_DB: scores
      POSTGRES_USER: scores
      POSTGRES_PASSWORD: scores
    volumes:
      - scores_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  scores_media:
  scores_db_data:
